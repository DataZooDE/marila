[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/aws_compat",
    "crates/core",
    "crates/embed_cli",
    "crates/integration_tests",
    "crates/storage",
    "crates/tables",
    "crates/vectors",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
marila-aws-compat = { path = "crates/aws_compat" }
marila-core = { path = "crates/core" }
marila-storage = { path = "crates/storage" }
marila-tables = { path = "crates/tables" }
marila-vectors = { path = "crates/vectors" }

# HTTP / async
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Time + ids
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Storage backends
# `duckdb` without the `bundled` feature links to system libduckdb
# (Arch package `duckdb` ships /usr/include/duckdb.h + /usr/lib/libduckdb.so).
# See CLAUDE.md C-3.
duckdb = { version = "1.10502", features = ["chrono"] }
aws-config = { version = "1", features = ["behavior-version-latest", "credentials-login", "sso"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Test-only — AWS S3 Vectors / Tables clients used by the contract tests.
aws-sdk-s3vectors = "1"
aws-sdk-s3tables = "1"

# CLI + ingestion (marila-embed)
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
blake3 = "1"
walkdir = "2"
globset = "0.4"
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-appender = "0.2"
num_cpus = "1"
toml = "0.9"
# Document parsing
pulldown-cmark = { version = "0.12", default-features = false }
scraper = { version = "0.20", default-features = false }
lopdf = "0.40"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
unicode-segmentation = "1"
# Tokenization (OpenAI)
tiktoken-rs = "0.7"

[profile.dev]
debug = 1            # smaller binary, faster link; full backtraces still work
incremental = true

