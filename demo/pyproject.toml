[project]
name = "marila-demo"
version = "0.1.0"
description = "boto3 demos that round-trip marila's AWS-JSON façades"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.41",       # ships the s3vectors + s3tables clients
    "botocore>=1.41",
    "openai>=2.0",       # embedding model for the OpenAI RAG demo
    "ollama>=0.4",       # chat + embeddings for the agentic parlis demo
    "textual>=0.80",     # TUI front-end for parlis_chat
]

# The demos are scripts, not an importable package. Tell setuptools so
# it doesn't try to auto-discover modules in the demo/ tree.
[tool.setuptools]
py-modules = []
