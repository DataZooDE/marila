[package]
name = "marila-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
marila = { path = "../api" }
marila-storage.workspace = true

axum.workspace = true
aws-config.workspace = true
aws-sdk-s3vectors.workspace = true
aws-sdk-s3tables.workspace = true
aws-credential-types.workspace = true
aws-smithy-types = "1"
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
reqwest.workspace = true

# Embedded RustFS for the test harness. Pinned at the `1.0.0-beta.3`
# tag (not yet published to crates.io as of 2026-05-19; the crates.io
# `rustfs = "0.0.2"` package is unrelated). Default features off so we
# skip ftps/webdav/sftp protocol stacks in the test build.
rustfs = { git = "https://github.com/rustfs/rustfs", tag = "1.0.0-beta.3", default-features = false }

[dev-dependencies]
tokio.workspace = true
anyhow.workspace = true
