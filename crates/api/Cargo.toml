[package]
name = "marila"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "marila"
path = "src/lib.rs"

[[bin]]
name = "marila"
path = "src/main.rs"

[features]
default = []
# Embed RustFS in-process so `cargo run -p marila --features embedded-rustfs`
# is a single-binary deploy with no docker / no separate object store.
# Same `rustfs::embedded::RustFSServer` we use in the integration tests.
embedded-rustfs = ["dep:rustfs"]

[dependencies]
marila-aws-compat.workspace = true
marila-core.workspace = true
marila-storage.workspace = true
marila-tables.workspace = true
marila-vectors.workspace = true

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rustfs = { git = "https://github.com/rustfs/rustfs", tag = "1.0.0-beta.3", default-features = false, optional = true }
